<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 492" role="img" aria-label="Cómo nace una nota"><rect width="100%" height="100%" fill="#061a36"/><text x="44" y="76" font-size="39" fill="#e9f6ff" font-family="Arial,sans-serif" font-weight="bold">Cómo nace una nota</text><g font-family="Arial,sans-serif"><rect x="42" y="128" width="1016" height="70" rx="12" fill="#132d54" stroke="#3d78bb"/><circle cx="82" cy="163" r="12" fill="#3cc9ff"/><text x="114" y="156" font-size="25" fill="white" font-weight="bold">1. Pulsar</text><text x="470" y="156" font-size="24" fill="#bbdafa">La cuerda se desplaza</text><rect x="42" y="211" width="1016" height="70" rx="12" fill="#0c2346" stroke="#3d78bb"/><circle cx="82" cy="246" r="12" fill="#3cc9ff"/><text x="114" y="239" font-size="25" fill="white" font-weight="bold">2. Vibrar</text><text x="470" y="239" font-size="24" fill="#bbdafa">Oscila al soltarse</text><rect x="42" y="294" width="1016" height="70" rx="12" fill="#132d54" stroke="#3d78bb"/><circle cx="82" cy="329" r="12" fill="#3cc9ff"/><text x="114" y="322" font-size="25" fill="white" font-weight="bold">3. Resonancia</text><text x="470" y="322" font-size="24" fill="#bbdafa">El cuerpo transmite</text><rect x="42" y="377" width="1016" height="70" rx="12" fill="#0c2346" stroke="#3d78bb"/><circle cx="82" cy="412" r="12" fill="#3cc9ff"/><text x="114" y="405" font-size="25" fill="white" font-weight="bold">4. Escuchar</text><text x="470" y="405" font-size="24" fill="#bbdafa">El aire lleva el sonido</text></g></svg>